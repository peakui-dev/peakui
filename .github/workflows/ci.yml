name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cost profile (GitHub Free, private repo — decided 2026-10-13, see
# peakui-company docs/ecosystem/backlog.md): cheap gates only, single node. The builds —
# classic docs, vinext docs, packages — run in the Release and Docs deploy workflows, where
# they execute per release / per deploy instead of on every PR. The node matrix is dropped:
# node >= 22.18 is declared in engines; re-add a slim second leg if a node-22 regression
# ever shows up. E2E stays parked as well (`pnpm test:e2e` locally).

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Гейты слоя токенов: дрейф, контраст, висящие токены, полнота тем, литеральные цвета.
      - run: pnpm check:tokens

      # Тесты скриптов харнеса: bootstrap и агентские хуки. Без этого шага регрессия в
      # compareVersions или collectFindings проходит в main зелёной.
      - run: pnpm test:ai
