name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # The docs app prerenders its llms files at build time and fails without a site URL; the
      # value here only has to be obviously not production.
      - run: pnpm build:docs
        env:
          NEXT_PUBLIC_SITE_URL: https://docs.ci.invalid

      # Гейты слоя токенов: дрейф, контраст, висящие токены, полнота тем, литеральные цвета.
      - run: pnpm check:tokens

      # The package gates validate the dist-based publish form (publishConfig), so the build
      # must exist before they pack.
      - run: pnpm build:packages

      - run: pnpm lint:package

      # Тесты скриптов харнеса: bootstrap и агентские хуки. Без этого шага регрессия в
      # compareVersions или collectFindings проходит в main зелёной.
      - run: pnpm test:ai

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @peakui/storybook exec playwright install --with-deps chromium

      # Собирает статику и гоняет e2e против неё, включая аудит WCAG 2.2 AA.
      - run: pnpm test:e2e:ci
