name: CI

on:
  workflow_dispatch:

# Cost posture (GitHub Free, private repo — decided 2026-10-14, recorded in
# peakui-company docs/ecosystem/backlog.md): nothing runs on push or on PRs. The gates
# below run locally before a push; dispatch this workflow to run the same set on a clean
# runner, e.g. ahead of a release. The builds — classic docs, vinext docs, packages —
# belong to the Release and Docs deploy workflows. E2E stays parked (`pnpm test:e2e`
# locally).

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Гейты слоя токенов: дрейф, контраст, висящие токены, полнота тем, литеральные цвета.
      - run: pnpm check:tokens

      # Тесты скриптов харнеса: bootstrap и агентские хуки. Без этого шага регрессия в
      # compareVersions или collectFindings проходит в main зелёной.
      - run: pnpm test:ai
