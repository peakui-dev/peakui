name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the publish without uploading or tagging"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Writes the .npmrc that maps NODE_AUTH_TOKEN onto the registry — without it
          # npm publish in publish-release.mjs runs unauthenticated (ENEEDAUTH).
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages

      # Publish-form gates live here, not in CI: the packed shape (publint, attw) only
      # matters right before packages go out, and this workflow is the cheapest place.
      - run: pnpm lint:package

      # Trusted publishing needs npm >= 11.5; the version bundled with node 24 is not pinned.
      - run: npm install -g npm@11

      - name: Version or publish
        uses: changesets/action@v1
        with:
          # changesets/action runs these inputs through exec(), without a shell: an
          # `&&` chain written here reaches changeset as its own arguments. The chain
          # lives in the release:version script, which pnpm does run through a shell.
          version: pnpm release:version
          publish: node scripts/publish-release.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted publishing: no token in the environment, so publish-release.mjs adds
          # --provenance and npm authenticates through OIDC. Requires the trusted publishers
          # configured on npmjs for both packages (repo peakui-dev/peakui, workflow
          # release.yml, environment npm-publish) and id-token: write above. Once the first
          # OIDC publish is verified, delete the NPM_TOKEN repo secret.
