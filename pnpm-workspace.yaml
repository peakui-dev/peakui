packages:
  - "packages/*"
  - "apps/*"
  - "evals"

allowBuilds:
  agent-browser: true
  esbuild: true
  # Нативный резолвер eslint-import-resolver-typescript.
  unrs-resolver: true
  workerd: true

# @typescript-eslint 8.71.0 опубликован без части своего же семейства: scope-manager и
# visitor-keys остановились на 8.70.0, и дерево не разрешается вообще. Пин снимается, когда
# апстрим доопубликует семейство целиком.
overrides:
  "@typescript-eslint/eslint-plugin": "8.70.0"
  "@typescript-eslint/parser": "8.70.0"
  "@typescript-eslint/project-service": "8.70.0"
  "@typescript-eslint/scope-manager": "8.70.0"
  "@typescript-eslint/tsconfig-utils": "8.70.0"
  "@typescript-eslint/type-utils": "8.70.0"
  "@typescript-eslint/types": "8.70.0"
  "@typescript-eslint/typescript-estree": "8.70.0"
  "@typescript-eslint/utils": "8.70.0"
  "@typescript-eslint/visitor-keys": "8.70.0"

  # fumadocs-core 16.9.3 wraps every mdast-util-to-markdown handler and drops the static
  # `attention` property that 2.1.3 started reading off the `strong` and `emphasis` handlers, so
  # serializing any bold text recurses until the stack overflows and `next build` of apps/docs
  # fails. 2.1.2 is the last release without that lookup. Remove once fumadocs-core preserves it.
  "mdast-util-to-markdown": "2.1.2"
